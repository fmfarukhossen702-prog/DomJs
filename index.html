<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="src/output.css" />
  </head>
  <body class="flex items-center justify-center h-screen text-white">
    <div class="mainBox bg-[#000000] w-100 h-125 p-10 ">
      <h1 class="text-center text-3xl p-7 -mt-10 font-bold text-[#ff00ee]">Add to Task</h1>
      <div class="inputBox relative  w-70">
        <input type="text" name="" onclick="inputClick()" id="text" placeholder="Enter your text " class="border outline-none pl-3 pr-10 py-2 block w-full rounded-2xl">
        <button id="relode" onclick="relodeClick()" class="absolute top-2 right-5">
          <i class="fa-solid fa-circle-notch" style="color: rgb(210, 230, 245);"></i>
        </button>
        <button id="submit" onclick="handleClick()" class="border mt-4 px-10 py-2 rounded-2xl text-red-700 border-white">Submit</button>

        
      </div>
      
      <div class="">
        <ul id="ulList" class="bg-[#61e6f07d] w-full h-50 mt-10 p-5 overflow-auto hide-scrollbar">
            
        </ul>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
